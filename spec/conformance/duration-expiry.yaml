# spec/conformance/duration-expiry.yaml
# expires: <n><s|m|h|d> is measured from the token iat (R8: iat > now fails).
openapl_conformance: '0.1'
suite: duration-expiry
policies:
  - inline: |
      openapl: '0.1'
      policy: p
      version: 1.0.0
      principals:
        bot:
          kind: agent
          identity: { oauth_client_id: bot }
          owner: priya@acme.com
          acts_for:
            - who: "user:h@acme.com"
              actions: [a.read]
      entitlements:
        - id: everyone-reads
          grant_to: ["*"]
          action: a.read
          resource: "doc/*"
          expires: 15m
defaults:
  request:
    chain:
      - { id: "user:h@acme.com", kind: human }
      - { id: bot, kind: agent }
    action: a.read
    resource: doc/1
    iat: 0
    now: 900
cases:
  - id: within-duration
    description: now - iat == 900 == 15m is still inside the window.
    expect: { decision: ALLOW }
  - id: past-duration
    request: { now: 901 }
    expect:
      decision: DENY
      reasons_include: ["user:h@acme.com has no grant for a.read on doc/1"]
  - id: no-iat
    request: { iat: null }
    expect: { decision: DENY }
  - id: iat-in-future
    description: R8. A token issued after the decision time fails duration expiry.
    request: { iat: 1001, now: 1000 }
    expect: { decision: DENY }
