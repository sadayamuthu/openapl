scenario: over-deep-delegation
title: A chain deeper than max_depth
threat: over-deep delegation
defaults:
  request:
    chain:
      - { id: "user:alice@acme.com", kind: human, claims: { groups: [analysts] } }
      - { id: agent-a, kind: agent }
      - { id: agent-b, kind: agent }
    action: report.run
    resource: report/q3
    now: 1000
cases:
  - id: depth-1
    request:
      chain:
        - { id: "user:alice@acme.com", kind: human, claims: { groups: [analysts] } }
        - { id: agent-a, kind: agent }
    expect: ALLOW
  - id: depth-2-at-the-limit
    expect: ALLOW
  - id: depth-3-over-the-limit
    description: Every edge exists and every endpoint is granted; only the depth fails.
    request:
      chain:
        - { id: "user:alice@acme.com", kind: human, claims: { groups: [analysts] } }
        - { id: agent-a, kind: agent }
        - { id: agent-b, kind: agent }
        - { id: agent-c, kind: agent }
    expect: DENY
    reasons_include: ["chain depth 3 exceeds 2"]
