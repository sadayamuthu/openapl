scenario: prompt-injected-escalation
title: An injected request for a tool outside every edge
threat: prompt-injected escalation
defaults:
  request:
    chain:
      - { id: "user:alice@acme.com", kind: human, claims: { groups: [support] } }
      - { id: helpdesk-agent, kind: agent }
    action: tickets.read
    resource: ticket/9
    now: 1000
cases:
  - id: delegated-read
    expect: ALLOW
  - id: injected-delete
    description: Alice may delete tickets herself, but never delegated that to the agent.
    request: { action: tickets.delete }
    expect: DENY
    reasons_include:
      - "no delegation edge user:alice@acme.com -> helpdesk-agent for tickets.delete"
      - "helpdesk-agent has no grant for tickets.delete on ticket/9"
  - id: lookalike-action-name
    description: tickets.read-all is not tickets.read; actions match exactly or by explicit glob.
    request: { action: tickets.read-all }
    expect: DENY
    reasons_include: ["no delegation edge user:alice@acme.com -> helpdesk-agent for tickets.read-all"]
