# Weekly update pull requests for Python packages, workflow actions and the
# container base images. Each ecosystem's updates arrive grouped in one pull request.
version: 2
updates:
  - package-ecosystem: pip
    directories: [/sdk, /sidecar, /demo/agentgateway]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: [/sidecar, /demo/agentgateway/mcp_servers, /demo/agentgateway/probe]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: deps
  - package-ecosystem: docker-compose
    directory: /demo/agentgateway
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
    commit-message:
      prefix: deps
