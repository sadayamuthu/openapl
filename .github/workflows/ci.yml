name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e 'sdk[dev]'
      - name: Test
        working-directory: sdk
        run: pytest -q
      - name: Validate examples
        run: python spec/scripts/validate_examples.py

  sidecar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e sdk -e 'sidecar[dev]'
      - name: Test
        working-directory: sidecar
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f sidecar/Dockerfile -t openapl-sidecar:ci .
      - name: Smoke test
        run: |
          docker run -d --name apl-smoke -p 127.0.0.1:18081:8081 \
            -e OPENAPL_PDP_TOKEN=t \
            -v "$PWD/spec/examples:/policies:ro" openapl-sidecar:ci
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' apl-smoke)
            [ "$s" = healthy ] && break
            sleep 1
          done
          echo "health: $s"
          [ "$s" = healthy ] || { docker logs apl-smoke; exit 1; }
          out=$(curl -s -H 'Authorization: Bearer t' -H 'Content-Type: application/json' \
            -d @sidecar/tests/data/authzen-allow.json \
            http://127.0.0.1:18081/access/v1/evaluation)
          echo "$out"
          echo "$out" | grep -q '"decision": true' || { docker logs apl-smoke; exit 1; }
          docker rm -f apl-smoke

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest -e sdk -e sidecar
      - name: Build Cedar image and pull OPA
        run: sh bench/tools.sh
      - name: Bench tests
        run: pytest bench/tests -q
      - name: OpenAPL, Cedar and Rego runners (any mismatch fails)
        run: |
          python bench/run_openapl.py --out "$RUNNER_TEMP/openapl.json"
          python bench/run_cedar.py --out "$RUNNER_TEMP/cedar.json"
          python bench/run_rego.py --out "$RUNNER_TEMP/rego.json"

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest -e sdk -e sidecar -r demo/agentgateway/requirements.txt
      - name: Unit tests
        run: pytest -q demo/agentgateway/tests
      - name: Run demo
        run: ./demo/agentgateway/run.sh
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-out
          path: |
            demo/agentgateway/out/
            !demo/agentgateway/out/private.pem
